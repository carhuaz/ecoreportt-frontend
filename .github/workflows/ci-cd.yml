name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main", "frontend" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Continuous Integration (Build & Validación)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación (Angular 22 Production Build)
        run: npm run build

  deploy:
    name: Continuous Deployment (Render)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Disparar Deploy Hook de Render
        run: |
          HOOK_URL="${{ secrets.HOOK_RENDER_FRONTEND || secrets.RENDER_DEPLOY_HOOK }}"
          if [ -z "$HOOK_URL" ]; then
            echo "::warning ::HOOK_RENDER_FRONTEND / RENDER_DEPLOY_HOOK no está configurado en GitHub Secrets aún."
          else
            echo "Disparando despliegue de Frontend en Render..."
            curl -X POST "$HOOK_URL" --fail
            echo "Despliegue de Frontend solicitado exitosamente a Render."
          fi
